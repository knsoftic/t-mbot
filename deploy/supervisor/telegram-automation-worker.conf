; /etc/supervisor/conf.d/telegram-automation-worker.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start "telegram-automation-worker:*"
;
; - autostart/autorestart: workers start on boot and are restarted if they die.
; - --timeout must stay below REDIS_QUEUE_RETRY_AFTER (400 s) so a running job is never handed to a second worker.
; - --max-time / --max-jobs recycle workers regularly (memory, code updates).
; - Failed jobs go to the failed_jobs table (Monitoring → Failed Jobs).

[program:telegram-automation-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/telegram-automation/artisan queue:work redis --queue=telegram,campaigns,default --sleep=1 --tries=3 --timeout=330 --max-time=3600 --max-jobs=1000
directory=/var/www/telegram-automation
user=www-data
numprocs=4
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/www/telegram-automation/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
